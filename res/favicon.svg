<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="bg-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0E1E38" />
      <stop offset="70%" stop-color="#070A13" />
      <stop offset="100%" stop-color="#04060B" />
    </radialGradient>
    <linearGradient id="beam-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#00F2FE" stop-opacity="0.05" />
    </linearGradient>
    <linearGradient id="cyan-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="100%" stop-color="#4FACFE" />
    </linearGradient>
    <linearGradient id="solar-panel" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0051A8" />
      <stop offset="50%" stop-color="#00F2FE" />
      <stop offset="100%" stop-color="#0051A8" />
    </linearGradient>
    <filter id="glow-filter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background circle -->
  <circle cx="256" cy="256" r="248" fill="url(#bg-glow)" stroke="#00F2FE" stroke-width="4" stroke-opacity="0.4" />

  <!-- Earth sphere representation -->
  <circle cx="256" cy="310" r="140" fill="#0A192F" stroke="#1E3A5F" stroke-width="2" />
  <!-- Latitude / Longitude arcs -->
  <ellipse cx="256" cy="310" rx="140" ry="50" fill="none" stroke="#00F2FE" stroke-opacity="0.25" stroke-dasharray="4,4" />
  <ellipse cx="256" cy="310" rx="80" ry="140" fill="none" stroke="#00F2FE" stroke-opacity="0.25" stroke-dasharray="4,4" />
  <line x1="116" y1="310" x2="396" y2="310" stroke="#00F2FE" stroke-opacity="0.4" stroke-width="1.5" />

  <!-- Geodesic cell area on globe -->
  <polygon points="210,290 270,270 310,300 290,340 230,335" fill="#00F2FE" fill-opacity="0.2" stroke="#00F2FE" stroke-width="2.5" />
  <!-- Centroid -->
  <circle cx="262" cy="307" r="6" fill="#FFB800" filter="url(#glow-filter)" />

  <!-- LEO Satellite Conical Beam -->
  <polygon points="175,130 210,290 310,300" fill="url(#beam-grad)" />

  <!-- Orbit Path -->
  <ellipse cx="256" cy="230" rx="200" ry="110" fill="none" stroke="#00F2FE" stroke-opacity="0.3" stroke-width="2" stroke-dasharray="8,6" transform="rotate(-25 256 230)" />

  <!-- LEO Satellite Bus -->
  <g transform="translate(175, 130) rotate(-25)">
    <!-- Solar Panels -->
    <rect x="-65" y="-10" width="45" height="20" rx="2" fill="url(#solar-panel)" stroke="#00F2FE" stroke-width="1" />
    <rect x="20" y="-10" width="45" height="20" rx="2" fill="url(#solar-panel)" stroke="#00F2FE" stroke-width="1" />
    <!-- Panel grid lines -->
    <line x1="-50" y1="-10" x2="-50" y2="10" stroke="#070A13" stroke-width="1.5" />
    <line x1="-35" y1="-10" x2="-35" y2="10" stroke="#070A13" stroke-width="1.5" />
    <line x1="35" y1="-10" x2="35" y2="10" stroke="#070A13" stroke-width="1.5" />
    <line x1="50" y1="-10" x2="50" y2="10" stroke="#070A13" stroke-width="1.5" />
    <!-- Satellite Body -->
    <rect x="-18" y="-14" width="36" height="28" rx="4" fill="#E2E8F0" stroke="#FFB800" stroke-width="2" />
    <!-- Sensor lens / dish -->
    <circle cx="0" cy="14" r="8" fill="#FFB800" />
    <circle cx="0" cy="0" r="4" fill="#00F2FE" filter="url(#glow-filter)" />
  </g>

  <!-- UE / Reference Point inside cell -->
  <circle cx="270" cy="300" r="5" fill="#00E676" filter="url(#glow-filter)" />
  <circle cx="270" cy="300" r="12" fill="none" stroke="#00E676" stroke-width="2" opacity="0.8" />
</svg>

